<svg xmlns="http://www.w3.org/2000/svg" width="1189" height="1362" viewBox="0 0 1189 1362" font-family="Helvetica,Arial,sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d32b2"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker>
<marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bb8800"/></marker>
</defs>
<rect width="1189" height="1362" fill="white"/>
<g><rect x="390" y="56" width="196" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>The promise &quot;this will keep resolving&quot; — breaking it is a breach, not an event.</title><text x="488" y="80.6" font-size="16" text-anchor="middle" fill="#12294d">canonical-location</text></g>
<g><rect x="624" y="492" width="525" height="380" rx="6" fill="#dbe4f8" fill-opacity="0.55" stroke="#3b5bdb" stroke-width="1.4"/><title>One narrowing supplied by a reference-act — connected to its referent by an agreement or by a fact, and nothing else.</title><text x="886" y="516" font-size="20" text-anchor="middle" fill="#12294d">descriptor</text></g>
<g><rect x="739" y="544" width="295" height="178" rx="6" fill="#dbe4f8" fill-opacity="0.55" stroke="#3b5bdb" stroke-width="1.4"/><title>A predicate the world satisfies — nothing was ever bound; the connection is recomputed from whatever satisfies it at each use.</title><text x="886" y="568" font-size="20" text-anchor="middle" fill="#12294d">description</text></g>
<g><rect x="757" y="596" width="259" height="108" rx="6" fill="#dbe4f8" fill-opacity="0.55" stroke="#3b5bdb" stroke-width="1.4"/><title>A containment claim over a designated container — &quot;contained in c&quot;, where c is named by a containment-coordinate.</title><text x="886" y="620" font-size="20" text-anchor="middle" fill="#12294d">location</text></g>
<g><rect x="775" y="648" width="223" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>A non-terminal step of a path that is itself a location.</title><text x="886" y="672.6" font-size="16" text-anchor="middle" fill="#12294d">intermediate-location</text></g>
<g><rect x="642" y="746" width="489" height="108" rx="6" fill="#dbe4f8" fill-opacity="0.55" stroke="#3b5bdb" stroke-width="1.4"/><title>A minted name bound to its referent by convention — the binding, not the referent's properties, is the whole connection.</title><text x="886" y="770" font-size="20" text-anchor="middle" fill="#12294d">designator</text></g>
<g><rect x="660" y="798" width="233" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>The name of one nesting container inside a location chain.</title><text x="776" y="822.6" font-size="16" text-anchor="middle" fill="#12294d">containment-coordinate</text></g>
<g><rect x="917" y="798" width="196" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>A designator for the target itself, as opposed to its containers.</title><text x="1015" y="822.6" font-size="16" text-anchor="middle" fill="#12294d">identity-component</text></g>
<g><rect x="440" y="543" width="131" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>The location a path routes to.</title><text x="505" y="567.6" font-size="16" text-anchor="middle" fill="#12294d">destination</text></g>
<g><rect x="839" y="921" width="84" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>A thing whose identity is independent of its current description — it persists through change.</title><text x="881" y="945.6" font-size="16" text-anchor="middle" fill="#12294d">entity</text></g>
<g><rect x="309" y="1284" width="168" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>How many the actor believes exist — &quot;no more than three, or I've grossly misunderstood the data.&quot;</title><text x="393" y="1308.6" font-size="16" text-anchor="middle" fill="#12294d">epistemic-bound</text></g>
<g><rect x="294" y="1093" width="214" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>How many referents the actor means to pick out — part of the act's type, knowable before resolution, and what gives a miss its meaning.</title><text x="401" y="1117.6" font-size="16" text-anchor="middle" fill="#12294d">expected-cardinality</text></g>
<g><rect x="911" y="391" width="177" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>Whoever maintains a designator's binding — a family, a filesystem, a store.</title><text x="999" y="415.6" font-size="16" text-anchor="middle" fill="#12294d">naming-community</text></g>
<g><rect x="291" y="1187" width="186" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>How many the act will touch — &quot;change the first,&quot; &quot;take them all.&quot;</title><text x="384" y="1211.6" font-size="16" text-anchor="middle" fill="#12294d">operational-bound</text></g>
<g><rect x="489" y="447" width="84" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>The location a path routes from.</title><text x="531" y="471.6" font-size="16" text-anchor="middle" fill="#12294d">origin</text></g>
<g><rect x="372" y="718" width="196" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>Descriptors past the minimum needed to reach one referent — they are verification and redundant routes, never waste.</title><text x="470" y="742.6" font-size="16" text-anchor="middle" fill="#12294d">over-determination</text></g>
<g><rect x="501" y="245" width="358" height="108" rx="6" fill="#dbe4f8" fill-opacity="0.55" stroke="#3b5bdb" stroke-width="1.4"/><title>One set of monotonic steps between two locations.</title><text x="680" y="269" font-size="20" text-anchor="middle" fill="#12294d">path</text></g>
<g><rect x="519" y="297" width="158" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>A path routable to its destination from any origin (within a bounded context).</title><text x="598" y="321.6" font-size="16" text-anchor="middle" fill="#12294d">universal-path</text></g>
<g><rect x="701" y="297" width="140" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>No promise at all: whatever route works from here, now — expected to expire with its context.</title><text x="771" y="321.6" font-size="16" text-anchor="middle" fill="#12294d">working-path</text></g>
<g><rect x="77" y="1114" width="131" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>What an engine resolves relative to: an origin, a scope, a moment, a policy about what counts as the world.</title><text x="142" y="1138.6" font-size="16" text-anchor="middle" fill="#12294d">perspective</text></g>
<g><rect x="390" y="152" width="196" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>The promise &quot;this resolves today, and it's the one we'd rather you use.&quot;</title><text x="488" y="176.6" font-size="16" text-anchor="middle" fill="#12294d">preferred-location</text></g>
<g><rect x="40" y="922" width="205" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>Per-hop ownership of resolution: each intermediate location routes only its next hop.</title><text x="142" y="946.6" font-size="16" text-anchor="middle" fill="#12294d">progressive-routing</text></g>
<g><rect x="402" y="914" width="149" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>&quot;The address you gave us is ambiguous and there are several people by that name it might end up with.&quot; — the refused package that opens the postal model</title><text x="476" y="938.6" font-size="16" text-anchor="middle" fill="#12294d">reference-act</text></g>
<g><rect x="466" y="814" width="103" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>The thing a reference-act intends to pick out.</title><text x="517" y="838.6" font-size="16" text-anchor="middle" fill="#12294d">referent</text></g>
<g><rect x="49" y="1018" width="186" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>What performs resolution — never a property of the act itself.</title><text x="142" y="1042.6" font-size="16" text-anchor="middle" fill="#12294d">resolution-engine</text></g>
<g><rect x="649" y="40" width="158" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>Why order appears in an address at all — and exactly what an engine may optimize.</title><text x="728" y="64.6" font-size="16" text-anchor="middle" fill="#12294d">sequence-cause</text></g>
<g><rect x="648" y="136" width="149" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>The promise &quot;this names IT&quot; — held by the minting community, independent of routability.</title><text x="722" y="160.6" font-size="16" text-anchor="middle" fill="#12294d">true-identity</text></g>
<g><rect x="811" y="1017" width="140" height="38" rx="5" fill="#f4f7fe" stroke="#3b5bdb" stroke-width="1.3"/><title>A thing that IS its description — &quot;which one&quot; is a meaningless question.</title><text x="881" y="1041.6" font-size="16" text-anchor="middle" fill="#12294d">value-object</text></g>
